(function(){var _0={u1a:{n:'U1A',c1:['B: She watched TV at home.','C: By bus.','C: $25.','A: She needs a partner.'],c2:['A: The yard of the house. & B: Check the house in person.','B: She often buys things without much thought. & A: Making a shopping list.','B: Heavy study loads. & B: Parent and child.','B: Engineering. & A: He should never give up his interest.','C: Stressful work environment. & C: Telling a story about choosing a simpler life over work stress.'],r:['Organise / Organize','trust','patient','review'],t:'Sam Smith tells us how to make confident choices. First, make a list. Organise all the possible choices in a list, so we can consider them one by one. Once we\\\'ve thought through all of them, think about each choice carefully and cross out those we don\\\'t want. As we start ruling out the choices that don\\\'t fit, the right path will become clearer. Second, ask for help. When we feel confused, talk about our options with someone we trust to help guide us in the right direction. But remember the final decision is ours. Others can give us a map, but we decide where to go. Third, be patient. Avoid rushed decisions whenever we can. Many poor decisions happen because people don\\\'t take enough time to think carefully. Stay calm and review our choices with a cool head, as this is the best way to start. He hopes these tips help us make more confident choices.',a:['People who achieve great success and stand out in their fields are considered high flyers.','High flyers inspire others by showing what can be achieved through hard work and creativity.','Be willing to take on challenges. Think creatively and seek ways to stand out.']},u1b:{n:'U1B',c1:['B: Growing vegetables.','B: 20%.','C: On Wednesday afternoon.','C: The lines are too long.'],c2:['C: Music. & A: The power supply was unstable.','B: She has learned to listen more. & A: At a hospital.','A: Get wooden floors. & A: Customer and home designer.','B: Exploration of different career choices. & A: Offering advice.','C: He opened his first store. & C: To encourage people to follow their dreams.'],r:['sleep','Plan','schedule','afraid'],t:'Sam Smith tells us how to manage our stress of study better. First, take care of our health. Practicing self care is especially important. We should eat healthy meals regularly and get enough sleep, which will help us stay focused. Choose exercises that we enjoy as they can be a great way to improve our mood. For example, playing basketball with friends can be fun and relaxing. Second, plan our study wisely. Create a daily or weekly schedule to organize our tasks, so we know what to work on each day. Take short breaks to relax after studying for a while. In this way, we can avoid feeling too tired. Third, don\\\'t be afraid to ask for help. If a subject is giving us trouble, ask our teacher, classmates, or even search for online resources to get help. Be open and honest about what we don\\\'t understand: it will help others know how to assist us better. He hopes these tips will help us manage our stress of study better.',a:['Somebody who grew up in the information age.','They share personal information on social media carelessly.','Be careful with their personal information. Spend less time on screens.']},u2b:{n:'U2B',c1:['A: At 8:30 a.m.','B: Practicing alone.','B: $105.','B: To the park.'],c2:['C: A month ago. & C: Warm up.','B: The man improved his running speed. & C: Close friends.','A: Ways to make new friends. & A: At home.','B: To get details about a sports programme. & B: On Wednesday.','A: To inspire others to push through challenges. & A: She moved to Germany.'],r:['basics','regularly','suits','open'],t:'Sam Smith tells us how to get the most out of team sports. First, start with the basics. Having a good understanding of the sport is necessary for performing well in any team sport. We should learn the rules of the game, which can help us make smarter decisions during play. Practise basic techniques regularly so we can improve our skills step by step. Second, find a team that suits us. Make sure the team\\\'s schedule and skill level match our needs. This can help ensure a better experience. Also, try joining a few team practices first to see if it\\\'s the right team for us. Third, always communicate with our teammates. We should keep an open conversation so we can learn from each other, and feel more connected to our team. Be supportive and encourage others, as this will create a positive atmosphere within the team. He hopes these tips will help us make the most out of team sports.',a:['It is a fun activity where you use the wind to make a kite fly in the sky.','It can help children improve their eyesight by encouraging them to look into the distance and spend more time outdoors in natural light.','Check the weather. Find a large, open area.']},u5a:{n:'U5A',c1:['B: To the recycling center.','C: A waterfall and the sunset.','C: 6 meters.','C: Animal home loss.'],c2:['B: He believes it\\\'s beneficial. & A: Because it shows the power of teamwork.','A: Using less paper. & B: A project to protect rainforests.','B: Rent desks or rooms to study together. & A: Classmates.','C: To teach the public about sandstorms. & C: Introducing the government\\\'s plan to stop sandstorms.','C: Organizing environmental projects. & A: A teacher.'],r:['fix','plastic','Inspire','community'],t:'Sam Smith talks about how we can protect wildlife. First, protect natural environments. Forests, wetlands, and oceans are important for supporting wildlife. We can help by supporting wildlife parks or national parks, which help save animals and plants. We can also join programs to fix natural areas, such as tree planting events or beach clean ups, to help improve areas damaged by human activities. Second, reduce the harm caused by human activities. Choose eco friendly products and avoid items made from wild animals, such as fur. Cut back on plastic use, as plastic pollution harms ocean life and other wildlife. Finally, inspire others to take action. Share the importance of wildlife protection through community events or social media platforms. Encourage friends and family to join local protection efforts, such as recycling events.',a:['It is the increase in greenhouse gases in the air.','Many wild animals are at risk of losing their homes.','Recycle more in daily life and use renewable energy sources.']},u9a:{n:'U9A',c1:['C: $160.','B: By taxi.','B: Because his group members ignored him.','B: At home.'],c2:['A: Learning a new language. & B: He has watched French TV shows.','B: A journalist. & A: United.','A: By making a call. & B: Hopeful.','A: He has watched some documentaries. & B: Some learning methods.','A: Memory becomes weaker slowly. & C: To promote his online course.'],r:['Combine','variety','strategies','repeated'],t:'Sam Smith tells us how to be successful in learning English. First, find out our own interests. Everyone has different hobbies, so work out what we enjoy the most. This will keep us motivated. Then, combine our interests with English learning. For example, if we enjoy sports, we can watch English sports shows or read sports articles in English. Second, use a variety of resources. Learn "real English", not just textbook English. To learn more words, read some classic works, including novels and poems. Besides, use online resources since it\\\'s a good chance to update our knowledge. Last, improve our listening strategies. Listening is very important because it helps us understand spoken English and talk with others. Listen to songs or music videos in English. Don\\\'t worry if we don\\\'t understand some things. Just keep listening and pay attention to the repeated words. Over time, we will make progress! He hopes everyone can be successful in learning English.',a:['Learning disability is an issue that can prevent people from learning new things.','People with learning disability may have trouble paying attention, understanding information, and remember
